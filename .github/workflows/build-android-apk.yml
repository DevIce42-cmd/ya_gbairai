name: Build Android APK (Y'A GBAIRAI !)

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Android APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ya-gbairai-android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ya-gbairai-android-apk
          path: ya-gbairai-android.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "Y'A GBAIRAI ! — Application Android (APK)"
          body: |
            Téléchargez **ya-gbairai-android.apk** directement sur votre téléphone Android et installez-le en un clic !
          files: ya-gbairai-android.apk
          make_latest: true
